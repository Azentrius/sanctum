<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>NextCloud SuperApp</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <meta name="theme-color" content="#F6F5FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0D22" media="(prefers-color-scheme: dark)">

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <script>
    (function () {
      try {
        var p = localStorage.getItem('sanctum.theme');
        if (p === 'light') document.body.classList.add('theme-light');
        else if (p === 'dark') document.body.classList.add('theme-dark');
        /* 'system' oder leer -> keine Klasse, prefers-color-scheme greift */
      } catch (e) {
        console.debug('sanctum.theme bootstrap skipped', e);
      }
    })();
  </script>
  <app-root></app-root>
</body>

</html>
