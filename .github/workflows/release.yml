# SPDX-License-Identifier: GPL-3.0-or-later
# Makes a release on request: Actions › release › Run workflow (on main).
# The job `build` checks the version, runs the same checks as CI and builds the signed foss APK with
# the keystore from the repository secrets. The job `publish` installs nothing: it creates the tag
# vVERSION with a GitHub release (APK, SHA256SUMS, notes from CHANGELOG.md) and a signed build
# provenance for the APK.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.8.0 (empty: the version in package.json)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main only (this run: $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          code=$(node -p "require('./package.json').version")
          version=${INPUT_VERSION:-$code}
          version=${version#v}
          if [ "$version" != "$code" ]; then
            echo "::error::Version $version differs from package.json ($code). Change package.json first."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version exists already."
            exit 1
          fi
          node scripts/release-notes.mjs "$version" --require-date > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Install the pinned Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Lint and tests
        run: |
          npm run lint
          npm run test:ci
          npm run test:scripts
      - name: Web build with the build metadata, Capacitor sync
        run: |
          node scripts/inject-build-metadata.mjs
          npm run build
          npx cap sync android

      - name: Signed foss APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::The signing secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are not all set."
            exit 1
          fi
          trap 'rm -f android/app/release.jks android/key.properties' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
          (cd android && bash ./gradlew --no-daemon assembleFossRelease)

      - name: Check the APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk=android/app/build/outputs/apk/foss/release/app-foss-release.apk
          bash scripts/verify-foss-purity.sh "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          mkdir dist
          cp "$apk" "dist/sanctum-$VERSION.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          retention-days: 7
          if-no-files-found: error
          path: dist/*.apk

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write       # tag and release
      id-token: write       # signing the build provenance
      attestations: write   # storing the build provenance
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum "sanctum-$VERSION.apk" > SHA256SUMS
      - name: Build provenance for the APK
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/sanctum-${{ needs.build.outputs.version }}.apk
      - name: Release notes
        run: |
          node scripts/release-notes.mjs "$VERSION" --require-date > notes.md
          {
            echo
            echo "### Install"
            echo
            echo "Download \`sanctum-$VERSION.apk\` and \`SHA256SUMS\`, check them, then install the APK on your phone:"
            echo
            echo '```sh'
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo "gh attestation verify sanctum-$VERSION.apk --repo $GITHUB_REPOSITORY"
            echo "adb install -r sanctum-$VERSION.apk"
            echo '```'
          } >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -- --target "$GITHUB_SHA" --title "Sanctum $VERSION" --notes-file notes.md
          if [ "$PRERELEASE" = "true" ]; then
            set -- "$@" --prerelease
          fi
          gh release create "v$VERSION" "dist/sanctum-$VERSION.apk" dist/SHA256SUMS "$@"
