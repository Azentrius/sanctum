// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // One Kotlin version for the app and the plugins that read it (Capacitor's filesystem plugin).
    // 2.4: dav4jvm 5 is built with it; Kotlin 2.4.21 supports AGP 8.5.2 to 9.3.1.
    ext.kotlin_version = '2.4.21'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.5.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // dav4jvm is published only on JitPack; nothing else may come from there.
        maven {
            url = 'https://jitpack.io'
            content {
                includeGroup 'com.github.bitfireAT'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
