# Dependabot version updates for the npm packages, the Android build and the GitHub Actions in .github/workflows.
# The groups take minor and patch updates; each major update comes as its own pull request.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      gradle:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Held with AGP 8.13, which cannot load Gradle 9.
      - dependency-name: "gradle-wrapper"
        update-types:
          - "version-update:semver-major"
      # AGP is held at 8.13 on purpose; AGP 9 is a migration of its own.
      - dependency-name: "com.android.tools.build:gradle"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
