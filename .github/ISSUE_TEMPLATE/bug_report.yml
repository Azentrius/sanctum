name: Bug report
description: Something in Sanctum does not work as described, or the calendar shows an event wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems do not belong here.** Report them privately as described in
        [SECURITY.md](https://github.com/Azentrius/sanctum/blob/main/SECURITY.md).

        This issue is public. Remove app passwords, server addresses, user names, calendar entries and
        other private data from everything you paste.
  - type: input
    id: version
    attributes:
      label: Sanctum version
      description: Shown at the bottom of the settings menu.
      placeholder: "0.7.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 8, Android 16"
    validations:
      required: true
  - type: input
    id: nextcloud
    attributes:
      label: Nextcloud version
      description: Of the server whose account is affected, if you know it.
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add an account
        2. Open the calendar
        3. ...
    validations:
      required: true
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Private data
      options:
        - label: >-
            I have removed app passwords, server addresses, user names, calendar entries and any other
            private data from everything above.
          required: true
