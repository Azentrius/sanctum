<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sanctum">
  <defs>
    <linearGradient id="sanctumBody" x1="20" y1="8" x2="82" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8273F2"/>
      <stop offset="0.55" stop-color="#5D4EE0"/>
      <stop offset="1" stop-color="#4334AE"/>
    </linearGradient>
    <radialGradient id="sanctumCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FBE0A8"/>
      <stop offset="0.45" stop-color="#F0B95A"/>
      <stop offset="1" stop-color="#E0A53E"/>
    </radialGradient>
    <radialGradient id="sanctumGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7CE7A" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#F7CE7A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer portal / sanctuary -->
  <path d="M50 6 C70 6 84 21 84 43 L84 58 C84 78 69 91 50 96 C31 91 16 78 16 58 L16 43 C16 21 30 6 50 6 Z"
        fill="url(#sanctumBody)"/>

  <!-- Inner sanctum outline -->
  <path d="M50 23 C64 23 72 34 72 47 L72 58 C72 72 62 81 50 85 C38 81 28 72 28 58 L28 47 C28 34 36 23 50 23 Z"
        fill="none" stroke="#C7BEF9" stroke-opacity="0.55" stroke-width="2.4"/>

  <!-- The light kept within -->
  <circle cx="50" cy="55" r="17" fill="url(#sanctumGlow)"/>
  <circle cx="50" cy="55" r="6.6" fill="url(#sanctumCore)"/>
</svg>
